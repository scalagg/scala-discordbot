plugins {
    id "application"
    id "org.jetbrains.kotlin.jvm" version "1.6.10"
    id "org.jetbrains.kotlin.kapt" version "1.6.10"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

group "gg.scala.discord"
version "1.0.0"

repositories {
    mavenCentral()

    maven {
        name "Scala"
        allowInsecureProtocol true
        url "http://repository.scala.gg/repository/maven-releases/"

        credentials {
            username property("scala.credentials.username") as String
            password property("scala.credentials.password") as String
        }
    }

    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.6.10'

    // jda
    implementation("net.dv8tion:JDA:5.0.0-alpha.5") {
        exclude module: 'opus-java'
    }

    // lamp
    implementation 'com.github.Revxrsal.Lamp:common:2.3'
    implementation 'com.github.Revxrsal.Lamp:jda:2.3'
    implementation 'com.github.Revxrsal.Lamp:cli:2.3'

    // scala
    implementation "gg.scala.flavor:flavor:0.1.3.1"
    implementation "net.evilblock.cubed:serializers:1.3.4"

    implementation "net.evilblock.cubed:store:1.3.4.1"

    implementation 'redis.clients:jedis:4.1.0'
    implementation 'org.mongodb:mongodb-driver:3.12.10'

    // google
    implementation 'com.google.guava:guava:31.0.1-jre'
    implementation 'com.google.code.gson:gson:2.8.9'
}

application {
    mainClassName "gg.scala.discord.ScalaDiscordBootstrap"
}

compileKotlin {
    kotlinOptions.javaParameters = true
    kotlinOptions.jvmTarget = "1.8"
}

shadowJar {
    archiveClassifier.set("")

    exclude "**/*.kotlin_metadata"
    exclude "**/*.kotlin_builtins"
    exclude "META-INF/"

    archiveFileName = "discord-bot.jar"
}

tasks.build.dependsOn(shadowJar)
