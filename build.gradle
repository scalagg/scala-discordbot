plugins {
    id "application"
    id "maven-publish"
    id "com.jfrog.artifactory" version "4.29.2"
    id "org.jetbrains.kotlin.jvm" version "1.9.20"
    id "org.jetbrains.kotlin.kapt" version "1.9.20"
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

group "gg.scala.discord"
version "1.0.0"

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }

    maven {
        url "${artifactory_contextUrl}/gradle-release"
        credentials {
            username "${artifactory_user}"
            password "${artifactory_password}"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.21"

    // jda
// https://mvnrepository.com/artifact/net.dv8tion/JDA
    implementation("net.dv8tion:JDA:5.0.0-beta.24")


    // lamp
    implementation "com.github.Revxrsal.Lamp:common:3.2.1"
    implementation "com.github.Revxrsal.Lamp:jda:3.2.1"
    implementation "com.github.Revxrsal.Lamp:cli:3.2.1"

    implementation("org.reflections:reflections:0.10.2")
    implementation 'com.konghq:unirest-java:3.11.09:standalone'
    // scala
    implementation "gg.scala.flavor:flavor:0.1.6"

    implementation "gg.scala.commons:serializers:3.5.2"
    implementation "gg.scala.commons:store:3.5.2"
    implementation "gg.scala.commons:velocity:3.5.2"

    implementation "com.squareup.okhttp:okhttp:2.7.5"
    implementation "io.lettuce:lettuce-core:6.2.1.RELEASE"

    implementation "gg.scala.store:shared:0.2.0"
    implementation "gg.scala.aware:aware:1.2.1"

// https://mvnrepository.com/artifact/org.mongodb/mongodb-driver-legacy
    implementation("org.mongodb:mongodb-driver-legacy:5.1.1")

    // captcha
    implementation "com.lamergameryt:lamercaptcha:1.0.0"

    // google
    implementation "com.google.guava:guava:31.1-jre"
    implementation "com.google.code.gson:gson:2.9.1"
}

application {
    mainClassName "gg.scala.discord.ScalaDiscordBootstrap"
}

compileKotlin {
    kotlinOptions.javaParameters = true
    kotlinOptions.jvmTarget = "1.8"
}

shadowJar {
    archiveClassifier.set("")

    exclude "**/*.kotlin_metadata"
    exclude "**/*.kotlin_builtins"
    exclude "META-INF/"

    mergeServiceFiles()
    archiveFileName = "bootstrap.jar"
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
        }
    }

    repositories {
        maven {
            name "scala"
            url "${artifactory_contextUrl}/${artifactory_release}"
            credentials {
                username "${artifactory_user}"
                password "${artifactory_password}"
            }
        }
    }
}

artifactory {
    this.contextUrl = "${artifactory_contextUrl}"

    publish {
        repository {
            repoKey = "${artifactory_release_local}"
            username = "${artifactory_user}"
            password = "${artifactory_password}"
            maven = true
        }
    }
}

tasks.build.dependsOn(
    shadowJar,
    publishShadowPublicationToScalaRepository
)
